services:
  mysql:
    image: mysql:8.0
    container_name: yoga-app-mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: test
      MYSQL_USER: user
      MYSQL_PASSWORD: 123456
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3306:3306"
    volumes:
      - ./ressources/sql/script.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "user", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - yoga-network

volumes:
  mysql-data:
    driver: local

networks:
  yoga-network:
    driver: bridge
